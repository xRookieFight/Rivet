[package]
name = "rivet"
version = "0.1.0"
edition = "2024"
description = "A native GitHub desktop client written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xRookieFight/Rivet"
readme = "README.md"
publish = false

[workspace]
members = ["android"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "links", "persistence", "wayland", "x11", "accesskit"] }
egui = "0.37"
egui_commonmark = { version = "0.26", features = ["better_syntax_highlighting"] }
egui_extras = { version = "0.37", features = ["svg", "image", "syntect", "http", "file"] }
git2 = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
similar = "2"
urlencoding = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
open = "5"
rfd = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["game-activity"] }
android-native-keyring-store = "1"
eframe = { version = "0.37", default-features = false, features = ["android-game-activity"] }
jni = "0.22"
keyring-core = "1"
ndk-context = "0.1"
rustls-platform-verifier = "0.7"
